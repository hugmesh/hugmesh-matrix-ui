# Per-response CSP nonce source. nginx's $request_id is a unique 32-hex-char
# token generated for every request, so it is a sound nonce: unguessable and
# different on each response. The `map` exposes it as $cspnonce, which is
# injected into BOTH the script-src directive and every <script> tag below so
# the two always agree.
map $request_id $cspnonce {
    default $request_id;
}

# Origin of the games portal that serves the "Shadows of the Net" 3D-room wasm
# bundle this UI embeds as an <iframe> (Chat3dHostComponent).
# PARAMETERIZED via a map so deployments rebrand it in ONE place: the
# generator's games-domain parameterization rewrites this default (the same
# knob that rebrands games.${GAMES_DOMAIN} elsewhere); local dev overrides it
# to the games portal's localhost port. It feeds ONLY the CSP frame-src below —
# the postMessage bridge pins/checks the same origin in app code.
# MUST agree with GAMES_BASE_URL's factory default in chat3d-bridge.ts: the app
# builds the iframe src from that token while THIS value is what the browser
# will actually allow in frame-src, so a mismatch is a room that never loads.
map "" $games_origin {
    default "https://games.hugmesh.systems";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + module-federation remotes + OAuth
    # redirect flows: none of these block same-origin scripts, cross-origin
    # script-based federation, or redirect-based login. Emitted with `always` so
    # they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection. DENY is consistent with
    #     the CSP `frame-ancestors 'none'` below — module federation loads
    #     remotes via <script>, not iframes, so denying framing entirely does
    #     not weaken the federation threat model.
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Native-federation remote: the hugmesh.systems host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    #
    # Content-Security-Policy (XSS backstop): a STRONG nonce-based policy. Every
    # response gets a fresh per-request nonce ($cspnonce, from $request_id). The
    # nonce is injected into both the script-src directive AND every <script>
    # tag in index.html (via sub_filter below), so only the bootstrap scripts we
    # actually shipped run — there is NO 'unsafe-inline' / 'unsafe-hashes' in
    # script-src, so any injected inline script is blocked.
    #   - default-src 'self'                        : same-origin default.
    #   - script-src 'self' 'nonce-$cspnonce' blob: : same-origin scripts +
    #     'wasm-unsafe-eval'                          nonce'd bootstrap scripts +
    #                                                  blob: (es-module-shims /
    #                                                  worker bootstraps). The
    #                                                  es-module-shims runtime
    #                                                  auto-propagates the nonce
    #                                                  to the ES modules it loads.
    #                                                  'wasm-unsafe-eval' allows
    #                                                  WebAssembly.compile ONLY
    #                                                  (NOT JS eval — that stays
    #                                                  blocked): the camera
    #                                                  face-tracking worker runs
    #                                                  the self-hosted MediaPipe
    #                                                  wasm in THIS page. The
    #                                                  Godot engine itself runs
    #                                                  in the games-origin iframe
    #                                                  (frame-src below), not
    #                                                  here.
    #   - style-src 'self' 'unsafe-inline' blob:    : Angular component styles are
    #                                                  injected as <style> at
    #                                                  runtime, so 'unsafe-inline'
    #                                                  is REQUIRED for styles.
    #   - img-src 'self' data: blob: https:         : avatars/media incl.
    #                                                  data:/blob:/remote https.
    #   - font-src 'self' data:                     : webfonts incl. data: fonts.
    #   - connect-src 'self' blob: https: wss:      : the BFF/gateway/Matrix
    #                                                  homeserver origins (incl.
    #                                                  /sync long-poll + Matrix
    #                                                  A/V WebSocket) are
    #                                                  env-configured, so this is
    #                                                  deliberately broad.
    #   - worker-src 'self' blob:                   : web/service workers (incl.
    #                                                  the face-tracking worker).
    #   - frame-src $games_origin                   : the ONE iframe this app
    #                                                  embeds — the games-portal
    #                                                  3D-room wasm bundle
    #                                                  (Chat3dHostComponent).
    #                                                  Everything else stays
    #                                                  un-frameable from here
    #                                                  (default frame-src would
    #                                                  otherwise fall back to
    #                                                  default-src 'self').
    #   - base-uri 'self'                           : stop <base> tag hijacking.
    #   - object-src 'none'                         : block <object>/<embed>.
    #   - frame-ancestors 'none'                    : deny all framing OF this
    #                                                  app (unchanged — WE embed
    #                                                  the game; nobody embeds
    #                                                  us; matches X-Frame-
    #                                                  Options DENY).
    # NOTE: nginx add_header does NOT merge across blocks — a child block with any
    # add_header discards inherited ones — so the CSP + security headers are set
    # here, in the block that actually serves index.html (where XSS would run).
    location / {
        add_header Access-Control-Allow-Origin "*" always;

        # Inject the per-request nonce into every <script> tag in index.html.
        #   - sub_filter_once off  : there are multiple <script> tags (zone.js,
        #                            es-module-shims, the app bootstrap) — rewrite
        #                            ALL of them, not just the first.
        #   - sub_filter_types text/html : ONLY rewrite the HTML document; never
        #                            touch JS bundles (which can legitimately
        #                            contain the literal string "<script").
        # NB: do NOT enable gzip_static / precompressed index.html — sub_filter
        # cannot rewrite an already-gzipped response, which would leave the
        # <script> tags un-nonced and break the page under this CSP.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        # media-src blob: — the 3D room's channel-media panel plays room video/
        # audio through authenticated blob: object URLs (open-in-panel, video v1);
        # without an explicit media-src the default-src 'self' fallback blocks them.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob: https: wss:; worker-src 'self' blob:; frame-src $games_origin; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        # nginx add_header inheritance: this location has its own add_header, so
        # the server-scope security headers are NOT inherited here — repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
        # nginx add_header inheritance: this location has its own add_header, so
        # the server-scope security headers are NOT inherited here — repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
