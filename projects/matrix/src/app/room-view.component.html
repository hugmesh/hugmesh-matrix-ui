<section class="room-view" data-testid="room-view" *ngIf="roomId() as rid"
         [attr.aria-label]="(summary()?.name || rid) + ' room'">
  <header class="room-header" data-testid="room-header">
    <span class="avatar" aria-hidden="true" [style.background-image]="avatarBg()"></span>
    <div class="meta">
      <h3 data-testid="room-name">{{ summary()?.name || rid }}</h3>
      <p data-testid="room-topic" class="topic">{{ summary()?.topic }}</p>
    </div>
    <span class="member-count">{{ memberCount() }} members</span>
    <nav class="header-actions" aria-label="Room actions">
      <!-- Embedded calls: both land on the existing /call route with ?room=;
           mode=vn-voice renders the audio-only VN stage, mode=video the
           original camera tiles (the default when mode is absent/unknown). -->
      <a [routerLink]="['call']" [relativeTo]="mount" [queryParams]="{ room: rid, mode: 'vn-voice' }"
         data-testid="btn-call-vn-voice" aria-label="Voice chat (VN)" title="Voice chat (VN)">
        <span aria-hidden="true">🎭</span>
      </a>
      <a [routerLink]="['call']" [relativeTo]="mount" [queryParams]="{ room: rid, mode: 'video' }"
         data-testid="btn-call-video" aria-label="Video call" title="Video call">
        <span aria-hidden="true">📹</span>
      </a>
      <!-- 3D room (Shadows of the Net): rendered ONLY when the room's
           net.hugmesh.chat3d state parses enabled — no dangling door
           into a room that will refuse to load. -->
      <a *ngIf="chat3dEnabled()" [routerLink]="['rooms', rid, 'chat3d']" [relativeTo]="mount"
         data-testid="btn-chat3d" aria-label="3D room (Shadows of the Net)"
         title="3D room (Shadows of the Net)">
        <span aria-hidden="true">🥽</span>
      </a>
      <a [routerLink]="['rooms', rid, 'members']" [relativeTo]="mount" data-testid="btn-member-list" aria-label="Members">
        <span aria-hidden="true">👥</span>
      </a>
      <a [routerLink]="['search']" [relativeTo]="mount" [queryParams]="{ room: rid }" data-testid="btn-room-search" aria-label="Search this room">
        <span aria-hidden="true">🔍</span>
      </a>
      <a [routerLink]="['rooms', rid, 'settings']" [relativeTo]="mount" data-testid="btn-room-settings" aria-label="Room settings">
        <span aria-hidden="true">⚙️</span>
      </a>
    </nav>
  </header>

  <!-- Timeline + an OPTIONAL live VN character beside it (B2, Path A). The panel
       resolves the latest sender's sticker pack fail-soft and renders NOTHING
       when there is none — so this row never breaks an ordinary room. -->
  <div class="room-body" data-testid="room-body">
    <hug-timeline [roomId]="rid" [me]="me()" [liveEvents]="liveEvents()"
                   [receipts]="readReceipts()" [members]="members()"
                   (reply)="onReply($event)" (edit)="onEdit($event)" (thread)="onThread($event)"></hug-timeline>
    <hug-character-panel data-testid="room-character-panel"
                          [ownerId]="characterOwner()" [ownerName]="characterOwnerName()"
                          [ownerScreenReaderName]="characterOwnerSrName()"
                          [expression]="characterExpression()"
                          [speakText]="latestMessage()?.body ?? null"
                          [roomId]="rid"></hug-character-panel>
  </div>

  <p *ngIf="typingUsers().length" class="typing" data-testid="typing-indicator"
     role="status" aria-live="polite">
    {{ typingUsers().join(', ') }} {{ typingUsers().length === 1 ? 'is' : 'are' }} typing…
  </p>

  <hug-composer [roomId]="rid" [target]="composerTarget()" [mode]="composerMode"
                 (sent)="onSent()" (modeReset)="onModeReset()"></hug-composer>
</section>
