<section class="hug-matrix" data-testid="matrix-view" aria-label="Matrix chat">
  <!-- CLIENT-CONNECT: first thing in the tab, for users granted the right to
       connect their own Matrix client. Renders nothing for everyone else, and
       renders a REASON rather than a URL unless the homeserver has been proven
       to answer a real client handshake. -->
  <hug-client-connect-banner></hug-client-connect-banner>

  <div class="topbar">
    <h2>Matrix</h2>
    <p data-testid="matrix-whoami" *ngIf="userId() as id">Signed in as {{ id }}</p>
    <nav class="nav" aria-label="Matrix sections" aria-describedby="matrix-nav-help">
      <a [routerLink]="['search']" [relativeTo]="mount">Search</a>
      <a [routerLink]="['settings']" [relativeTo]="mount">Settings</a>
      <a [routerLink]="['moderation']" [relativeTo]="mount">Moderation</a>
      <a [routerLink]="['call']" [relativeTo]="mount" [queryParams]="{ room: current()?.roomId }">Call</a>
    </nav>
    <p id="matrix-nav-help" class="section-help" data-testid="matrix-nav-help">
      Jump between sections: Search messages, your Settings, Moderation and safety tools, and a video
      Call in the selected room.
    </p>
  </div>

  <div class="shell" data-testid="matrix-shell">
    <hug-room-list
      [rooms]="rooms" [selectedRoomId]="current()?.roomId ?? null"
      (roomSelected)="select($event)"
      (roomsChanged)="onRooms($event)"></hug-room-list>

    <hug-room-view *ngIf="current() as room"
      [roomIdInput]="room.roomId"
      [syncRoom]="currentSync"></hug-room-view>

    <!-- MEMBERS as a persistent third pane, only where there is genuinely spare width.
         The message bubble is already capped at 46rem, so on a wide desktop everything
         right of the timeline was empty. Gated in TypeScript rather than hidden with CSS:
         this pane FETCHES the member list, and a phone should not pay for a pane it never
         sees. The /rooms/:rid/members route still works unchanged for narrow screens. -->
    <aside *ngIf="showMembersPane() && current() as room" class="members-pane"
           data-testid="members-pane" aria-label="Room members">
      <hug-member-list [roomIdInput]="room.roomId"></hug-member-list>
    </aside>

    <p *ngIf="!current()" class="empty" role="status">Select a room to start chatting.</p>
  </div>
</section>
