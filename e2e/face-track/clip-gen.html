<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>face-clip generator</title>
</head>
<body>
<canvas id="hi" width="512" height="384"></canvas>
<canvas id="lo" width="256" height="192"></canvas>
<script>
/**
 * Synthetic face-clip generator (XR-chat DESIGN §6 Stage 2 e2e).
 *
 * Draws NUM_FRAMES frames of an animated frontal face on a canvas — jaw
 * open/close cycles, a horizontal gaze sweep (hold left, hold right), a
 * two-frame blink, a brow raise — converts each frame to I420 planes
 * (BT.601 limited range) and POSTs the concatenated planes to the
 * gen-clip.mjs server, which writes the .y4m Chrome's
 * --use-file-for-fake-video-capture consumes.
 *
 * The face is deliberately photograph-ish (skin-tone shading, hair mass,
 * sclera/iris/pupil eyes, nostril shadows, lips + teeth) because MediaPipe's
 * BlazeFace detector is trained on real faces: flat cartoon line-art does not
 * reliably trigger detection. Validated: the committed clip is only kept if
 * the real FaceLandmarker actually detects it (run.mjs asserts face=true).
 *
 * Geometry/timing constants MUST match gen-clip.mjs (OUT_W/OUT_H/FPS).
 */
'use strict';

const OUT_W = 256, OUT_H = 192;   // committed clip geometry (keep <2MB total)
const NUM_FRAMES = 24;            // 2s loop @ 12fps; Chrome loops the file
const W = 512, H = 384;           // hi-res draw, downscaled for soft edges

const hi = document.getElementById('hi');
const lo = document.getElementById('lo');
const ctx = hi.getContext('2d');
const lctx = lo.getContext('2d', { willReadFrequently: true });

/** Per-frame animation params: jaw 0..1, gazeX -1..1, blink 0..1, brow 0..1. */
function timeline(i) {
  const p = { jaw: 0.05, gazeX: 0, gazeY: 0, blink: 0, brow: 0.15 };
  if (i <= 7) {
    // full jaw open/close cycle (jawOpen sweep)
    p.jaw = Math.sin(Math.PI * i / 7);
  } else if (i <= 11) {
    // hold gaze LEFT (eyeLookOutLeft / eyeLookInRight)
    p.gazeX = -1;
    p.jaw = 0.1;
  } else if (i <= 15) {
    // hold gaze RIGHT (eyeLookInLeft / eyeLookOutRight)
    p.gazeX = 1;
    p.jaw = 0.1;
  } else if (i <= 18) {
    // three-frame blink (~250ms @12fps — long enough that the tracker's
    // temporal smoothing registers fully closed lids)
    p.blink = 1;
  } else if (i === 19) {
    // eyes wide + brows up
    p.brow = 1;
  } else {
    // second, softer jaw cycle + brow raise held
    p.jaw = 0.8 * Math.sin(Math.PI * (i - 20) / 3);
    p.brow = 0.6;
  }
  return p;
}

function drawEye(ex, ey, p) {
  if (p.blink >= 0.9) {
    // fully closed lid: no sclera at all — a skin fold + a downward lash
    // curve reads as "shut" to the landmarker far better than a 1px sliver
    ctx.strokeStyle = '#8a5c40';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ex - 26, ey - 2); ctx.quadraticCurveTo(ex, ey + 8, ex + 26, ey - 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,75,50,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ex - 20, ey + 8); ctx.quadraticCurveTo(ex, ey + 14, ex + 20, ey + 8); ctx.stroke();
    return;
  }
  const openness = Math.max(0.06, (1 - p.blink) * (1 + 0.25 * p.brow));
  const ry = 15 * openness;
  // sclera
  ctx.fillStyle = '#f7f4ef';
  ctx.beginPath(); ctx.ellipse(ex, ey, 27, ry, 0, 0, 2 * Math.PI); ctx.fill();
  // iris/pupil clipped inside the lid aperture
  ctx.save();
  ctx.beginPath(); ctx.ellipse(ex, ey, 27, ry, 0, 0, 2 * Math.PI); ctx.clip();
  const ix = ex + p.gazeX * 10, iy = ey + p.gazeY * 5;
  ctx.fillStyle = '#5a3a22';
  ctx.beginPath(); ctx.arc(ix, iy, 12, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#171310';
  ctx.beginPath(); ctx.arc(ix, iy, 5.5, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(ix - 3, iy - 3, 2.2, 0, 2 * Math.PI); ctx.fill();
  ctx.restore();
  // upper-lid crease
  ctx.strokeStyle = '#8a5c40';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(ex, ey, 27, ry, 0, Math.PI, 2 * Math.PI); ctx.stroke();
}

function drawFace(p) {
  const cx = W / 2;
  // backdrop
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#3a4150');
  bg.addColorStop(1, '#232833');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  // shoulders + neck
  ctx.fillStyle = '#2b3550';
  ctx.beginPath(); ctx.ellipse(cx, H + 40, 220, 130, 0, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#d9a184';
  ctx.fillRect(cx - 38, 270, 76, 85);
  // head
  const skin = ctx.createRadialGradient(cx - 20, 150, 40, cx, 185, 165);
  skin.addColorStop(0, '#eebd9c');
  skin.addColorStop(0.75, '#e0a985');
  skin.addColorStop(1, '#c9906c');
  // ears (behind the head edge)
  ctx.fillStyle = '#d9a184';
  ctx.beginPath(); ctx.ellipse(cx - 113, 195, 16, 30, 0, 0, 2 * Math.PI); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 113, 195, 16, 30, 0, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.ellipse(cx, 185, 112, 142, 0, 0, 2 * Math.PI); ctx.fill();
  // hair mass
  ctx.fillStyle = '#3c2a20';
  ctx.beginPath(); ctx.ellipse(cx, 72, 118, 64, 0, 0, 2 * Math.PI); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx - 100, 120, 26, 60, -0.25, 0, 2 * Math.PI); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 100, 120, 26, 60, 0.25, 0, 2 * Math.PI); ctx.fill();
  // brows
  const by = 150 - p.brow * 14;
  ctx.strokeStyle = '#3c2a20';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - 71, by + 4); ctx.quadraticCurveTo(cx - 45, by - 6, cx - 19, by + 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 19, by + 2); ctx.quadraticCurveTo(cx + 45, by - 6, cx + 71, by + 4); ctx.stroke();
  // eyes
  drawEye(cx - 45, 178, p);
  drawEye(cx + 45, 178, p);
  // nose bridge shading + tip + nostrils
  ctx.strokeStyle = 'rgba(150,95,65,0.55)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - 8, 190); ctx.quadraticCurveTo(cx - 12, 222, cx - 16, 236); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 8, 190); ctx.quadraticCurveTo(cx + 12, 222, cx + 16, 236); ctx.stroke();
  ctx.fillStyle = '#d09873';
  ctx.beginPath(); ctx.ellipse(cx, 240, 20, 12, 0, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#7a4a30';
  ctx.beginPath(); ctx.ellipse(cx - 10, 245, 4.5, 3, 0, 0, 2 * Math.PI); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 10, 245, 4.5, 3, 0, 0, 2 * Math.PI); ctx.fill();
  // mouth (jaw-driven aperture + teeth)
  const mouthY = 290;
  const mouthH = 3 + p.jaw * 30;
  ctx.fillStyle = '#5a1f1c';
  ctx.beginPath(); ctx.ellipse(cx, mouthY + mouthH * 0.35, 34, Math.max(2.5, mouthH), 0, 0, 2 * Math.PI); ctx.fill();
  if (p.jaw > 0.25) {
    ctx.fillStyle = '#f2ece2';
    ctx.fillRect(cx - 24, mouthY - mouthH * 0.35, 48, 7);
  }
  ctx.strokeStyle = '#a85a48';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(cx - 34, mouthY - mouthH * 0.5); ctx.quadraticCurveTo(cx, mouthY - mouthH * 0.5 - 6, cx + 34, mouthY - mouthH * 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 34, mouthY + mouthH * 0.9); ctx.quadraticCurveTo(cx, mouthY + mouthH * 0.9 + 8, cx + 34, mouthY + mouthH * 0.9); ctx.stroke();
}

const clamp8 = (v) => Math.max(0, Math.min(255, Math.round(v)));

/** RGBA → I420 planes, BT.601 limited range (what y4m consumers expect). */
function toI420(img, w, h) {
  const d = img.data;
  const y = new Uint8Array(w * h);
  const u = new Uint8Array((w * h) / 4);
  const v = new Uint8Array((w * h) / 4);
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      const k = (j * w + i) * 4;
      y[j * w + i] = clamp8(16 + (65.738 * d[k] + 129.057 * d[k + 1] + 25.064 * d[k + 2]) / 256);
    }
  }
  for (let j = 0; j < h; j += 2) {
    for (let i = 0; i < w; i += 2) {
      let R = 0, G = 0, B = 0;
      for (const [dj, di] of [[0, 0], [0, 1], [1, 0], [1, 1]]) {
        const k = ((j + dj) * w + (i + di)) * 4;
        R += d[k]; G += d[k + 1]; B += d[k + 2];
      }
      R /= 4; G /= 4; B /= 4;
      const ci = (j / 2) * (w / 2) + i / 2;
      u[ci] = clamp8(128 + (-37.945 * R - 74.494 * G + 112.439 * B) / 256);
      v[ci] = clamp8(128 + (112.439 * R - 94.154 * G - 18.285 * B) / 256);
    }
  }
  return { y, u, v };
}

async function main() {
  const frameBytes = OUT_W * OUT_H * 1.5;
  const all = new Uint8Array(NUM_FRAMES * frameBytes);
  for (let i = 0; i < NUM_FRAMES; i++) {
    drawFace(timeline(i));
    lctx.drawImage(hi, 0, 0, OUT_W, OUT_H);
    const { y, u, v } = toI420(lctx.getImageData(0, 0, OUT_W, OUT_H), OUT_W, OUT_H);
    all.set(y, i * frameBytes);
    all.set(u, i * frameBytes + y.length);
    all.set(v, i * frameBytes + y.length + u.length);
  }
  await fetch('/frames', { method: 'POST', body: all });
  document.title = 'done';
}
main().catch((e) => fetch('/error', { method: 'POST', body: String(e) }));
</script>
</body>
</html>
